<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NISSAN Almaty — официальный дилер Nissan в Алматы. Nissan Patrol и Qashqai, тест-драйв, кредит и trade-in."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>NISSAN Almaty | Официальный дилер</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bioen-theme");
          if (t === "light") document.documentElement.dataset.theme = "light";
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var l = localStorage.getItem("bioen-locale");
          var loc =
            l && ["en", "ru", "kk"].indexOf(l) !== -1 ? l : "ru";
          document.documentElement.lang =
            loc === "kk" ? "kk" : loc === "en" ? "en" : "ru";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
